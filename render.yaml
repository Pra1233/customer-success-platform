databases:
  - name: csp-db
    plan: free
    databaseName: csp_db
    user: csp_user

services:
  - type: keyvalue
    name: csp-redis
    plan: free
    ipAllowList: []

  - type: web
    name: csp-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: csp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: csp-redis
          property: connectionString
      - key: DASHBOARD_CACHE_TTL_SECONDS
        value: "60"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: AI_API_BASE_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: AI_SEMAPHORE_TIMEOUT_SECONDS
        value: "10.0"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30.0"
      - key: AI_MAX_ATTEMPTS
        value: "2"
      - key: FRONTEND_ORIGIN
        sync: false
